<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f3f6fb">
  <title>登录 · Claude Catche</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'><rect width='40' height='40' rx='11' fill='%232563eb'/><path d='M26.5 13.2A9 9 0 1 0 26.5 26.8' fill='none' stroke='white' stroke-width='3.2' stroke-linecap='round'/><circle cx='27.5' cy='20' r='2.6' fill='white'/></svg>">
  <script>try{var t=localStorage.getItem('theme');if(t)document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
  <link rel="stylesheet" href="/atelier-static/atelier.css?v=5">
</head>
<body class="login-page">
  <button class="icon-btn login-theme" type="button" id="theme" aria-label="切换主题"></button>
  <form class="login-card" id="login-form">
    <div class="brand">
      <svg class="brand-svg" width="40" height="40" viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="11" fill="var(--accent)"/><path d="M26.5 13.2A9 9 0 1 0 26.5 26.8" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round"/><circle cx="27.5" cy="20" r="2.6" fill="#fff"/></svg>
      <span><b>Claude Catche</b><small>AI 接口中转站</small></span>
    </div>
    <div>
      <h1>登录管理面板</h1>
      <p class="sub">在这里管理上游渠道、订阅账号、访问密钥和请求日志。</p>
    </div>
    <label class="field">
      <span class="label">管理员密码</span>
      <input id="password" type="password" autocomplete="current-password" autofocus placeholder="输入密码">
    </label>
    <p class="login-error" id="login-error" aria-live="polite"></p>
    <button class="btn primary" type="submit"><span>登录</span></button>
  </form>
  <script>
    if (localStorage.getItem('token')) location.href = '/dashboard';
    const sun = '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
    const moon = '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 14.5A8.5 8.5 0 1 1 9.5 3.5a7 7 0 0 0 11 11z"/></svg>';
    const themeBtn = document.getElementById('theme');
    const isDark = () => (document.documentElement.getAttribute('data-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')) === 'dark';
    const paintTheme = () => { themeBtn.innerHTML = isDark() ? sun : moon; };
    themeBtn.onclick = () => { const next = isDark() ? 'light' : 'dark'; document.documentElement.setAttribute('data-theme', next); try { localStorage.setItem('theme', next); } catch (e) {} paintTheme(); };
    paintTheme();
    document.getElementById('login-form').addEventListener('submit', async (event) => {
      event.preventDefault();
      const button = event.currentTarget.querySelector('button[type=submit]');
      const error = document.getElementById('login-error');
      button.disabled = true; button.classList.add('loading'); error.textContent = '';
      try {
        const response = await fetch('/api/login', {
          method: 'POST', headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({password: document.getElementById('password').value})
        });
        if (!response.ok) throw new Error(response.status === 401 ? '密码不正确' : '登录失败');
        localStorage.setItem('token', (await response.json()).token);
        location.href = '/dashboard';
      } catch (e) {
        error.textContent = e.message;
        button.disabled = false; button.classList.remove('loading');
      }
    });
  </script>
</body>
</html>
